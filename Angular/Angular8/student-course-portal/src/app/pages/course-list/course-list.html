<h2>Available Courses</h2>

<div class="search-container">
  <input
    type="text"
    placeholder="Search courses..."
    [(ngModel)]="searchTerm"
    (input)="onSearchChange()"
    class="search-input">
</div>

<!-- Removed test buttons for create/update/delete as they are outside the scope of loadCourses NgRx flow -->

<p *ngIf="isLoading$ | async">Loading courses...</p>
<p *ngIf="errorMessage$ | async as errorMessage" style="color: red;">{{ errorMessage }}</p>

<div *ngIf="!(isLoading$ | async) && !(errorMessage$ | async)">
  <ng-container *ngIf="(courses$ | async) as courses">
    <ng-container *ngIf="courses.length; else noCourses">
      <app-course-card
        *ngFor="let course of courses; trackBy: trackByCourseId"
        [course]="course"
        (enrollRequested)="onEnroll($event)"
        appHighlight="lightblue">
      </app-course-card>
    </ng-container>
  </ng-container>

  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</div>

<p *ngIf="selectedCourseId">
  Selected Course ID: {{ selectedCourseId }}
</p>
